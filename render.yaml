databases:
  - name: radar-tech-db
    plan: free
    databaseName: radartech
    user: radartech
services:
  - type: web
    name: radar-tech-blog
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radar-tech-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.13.5"
