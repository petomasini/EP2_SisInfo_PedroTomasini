{% extends 'base.html' %}
{% block title %}{{ form_title }}{% endblock %}
{% block content %}
  <a class="breadcrumb" href="{% url 'post_list' %}">&larr; Voltar ao blog</a>
  <div class="form-card"><p class="eyebrow">EDITOR DE ARTIGOS</p><h1>{{ form_title }}</h1>
  <form method="post">{% csrf_token %}
    <label for="id_title">Título</label><input id="id_title" type="text" name="title" value="{{ post.title|default:'' }}" maxlength="200" required>
    <label for="id_content">Conteúdo HTML</label><textarea id="id_content" name="content" rows="10" required>{{ post.content|default:'' }}</textarea>
    <div class="form-actions"><button class="button" type="submit">Salvar post</button><a class="button-secondary" href="{% url 'post_list' %}">Cancelar</a></div>
  </form></div>
{% endblock %}
