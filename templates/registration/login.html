{% extends 'base.html' %}
{% block title %}Entrar{% endblock %}
{% block content %}
  <div class="form-card"><p class="eyebrow">ÁREA DE ACESSO</p><h1>Entrar</h1>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<p class="form-error">Usuário ou senha incorretos.</p>{% endif %}
    {{ form.as_p }}
    <div class="form-actions"><button class="button" type="submit">Entrar</button></div>
  </form><p>Não tem conta? <a class="read-link" href="{% url 'signup' %}">Cadastre-se</a>.</p></div>
{% endblock %}
