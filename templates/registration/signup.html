{% extends 'base.html' %}
{% block title %}Criar conta{% endblock %}
{% block content %}
  <div class="form-card"><p class="eyebrow">PARTICIPE DO BLOG</p><h1>Criar conta</h1>
    <form method="post">{% csrf_token %}
      {% for field in form %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
        {% for error in field.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
      {% endfor %}
      <div class="form-actions"><button class="button" type="submit">Cadastrar</button></div>
    </form>
  </div>
{% endblock %}
